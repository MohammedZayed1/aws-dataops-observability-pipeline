name: DataOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t dataops-app:test .

      - name: Start application container
        run: |
          docker run -d \
            --name dataops-app-test \
            -p 8080:80 \
            -p 8081:8081 \
            dataops-app:test

      - name: Wait for application
        run: |
          sleep 5

      - name: Smoke test application
        run: |
          curl --fail --silent --show-error http://localhost:8080/

      - name: Show container logs
        if: failure()
        run: |
          docker logs dataops-app-test

      - name: Stop and remove test container
        if: always()
        run: |
          docker rm -f dataops-app-test
