name: DataOps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: aws-dataops-observability-pipeline-app

jobs:
  build-test-push:
    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t dataops-app:${{ github.sha }} \
            .

      - name: Start application container
        run: |
          docker run -d \
            --name dataops-app-test \
            -p 8080:80 \
            -p 8081:8081 \
            dataops-app:${{ github.sha }}

      - name: Wait for application
        run: |
          sleep 5

      - name: Smoke test application
        run: |
          curl --fail --silent --show-error \
            http://localhost:8080/

      - name: Show container logs
        if: failure()
        run: |
          docker logs dataops-app-test

      - name: Stop and remove test container
        if: always()
        run: |
          docker rm -f dataops-app-test || true

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::173535830796:role/aws-dataops-observability-pipeline-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image for ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag \
            dataops-app:${{ github.sha }} \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

          docker tag \
            dataops-app:${{ github.sha }} \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Push Docker image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deployment summary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Docker image pushed successfully."
          echo "Image: $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          echo "Image: $ECR_REGISTRY/$ECR_REPOSITORY:latest"
