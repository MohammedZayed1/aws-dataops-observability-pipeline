
global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "Medozayed1970@gmail.com"
  smtp_auth_username: "Medozayed1970@gmail.com"
  smtp_auth_password_file: "/etc/alertmanager/secrets/gmail_app_password"
  smtp_require_tls: true

route:
  receiver: "email-notifications"
  group_by: ["alertname", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "email-notifications"
    email_configs:
      - to: "Medozayed1970@gmail.com"
        send_resolved: true
