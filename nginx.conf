events {}

http {
    include /etc/nginx/mime.types;

    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 8081;

        location /nginx_status {
            stub_status;
            access_log off;
        }
    }
}
